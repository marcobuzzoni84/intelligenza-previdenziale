<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ─── PALETTE ─────────────────────────────────────────────────── */
const Y="#F5C800",B="#090909",D="#141414",DL="#1E1E1E",MT="#5A5A5A",WH="#EBEBEB";

/* ─── COSTANTI ATTUARIALI ────────────────────────────────────── */
const COEFF   = {62:4.798,63:4.937,64:5.093,65:5.261,66:5.432,67:5.604,68:5.791,69:5.995,70:6.215};
const ALIQ    = {dipendente:.33,pubblico:.333,autonomo:.2572,forfettario:.2672,imprenditore:.24};
const TFR_PCT = .0691;
const GROW    = .020;   // +2%/anno media stipendi Italia ISTAT 2014–2024
const REVAL   = .015;   // rivalutazione montante INPS
const FONDO_R = .040;   // rendimento linea bilanciata Covip 2023
const TARGET  = .70;    // obiettivo 70% ultimo stipendio (standard EU)

const fc = n => new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);

/* ─── CALCOLO ─────────────────────────────────────────────────── */
function calcGap(d) {
  const birthYear = parseInt((d.birthDate||"1975").split("-")[0]);
  const age       = new Date().getFullYear()-birthYear;
  const ytr       = Math.max(1,67-age);
  const ral       = parseFloat(d.ralLorda)      ||30000;
  const anni      = parseInt(d.anniContributi)  ||10;
  const rate      = ALIQ[d.workType]||.33;

  const futureSal = ral*Math.pow(1+GROW,ytr);
  const targetA   = futureSal*TARGET;

  let montante=0;
  for(let i=0;i<anni;i++){
    const ps=ral*Math.pow(1-GROW*.6,anni-i);
    montante+=ps*rate*Math.pow(1+REVAL,anni-i+ytr);
  }
  let s=ral;
  for(let i=0;i<ytr;i++){montante+=s*rate*Math.pow(1+REVAL,ytr-i);s*=1+GROW;}

  const inpsA=montante*(COEFF[67]/100);
  const inpsM=inpsA/13;

  const hasFondo=d.hasFondoPensione===true||d.hasFondoPensione==="true";
  let fondoCap=0;
  if(hasFondo){
    const acc=parseFloat(d.fondoAccumulato)||0;
    const vers=parseFloat(d.fondoVersamentoAnnuo)||0;
    fondoCap=acc*Math.pow(1+FONDO_R,ytr);
    for(let i=0;i<ytr;i++) fondoCap+=vers*Math.pow(1+FONDO_R,ytr-i);
  }

  let tfrCap=0;
  if((d.includeTFR===true||d.includeTFR==="true")&&d.workType==="dipendente"){
    let ts=ral;
    for(let i=0;i<ytr;i++){tfrCap+=ts*TFR_PCT*Math.pow(1+.035,ytr-i);ts*=1+GROW;}
  }

  const fondoInc  =(fondoCap+tfrCap)*.04;
  const totalA    =inpsA+fondoInc;
  const gapA      =targetA-totalA;
  const r_m       =FONDO_R/12;
  const n_m       =ytr*12;
  const fv_f      =(Math.pow(1+r_m,n_m)-1)/r_m;
  const capNeed   =gapA>0?(gapA/.04):0;
  const monthlyNeed=capNeed>0?capNeed/fv_f:0;

  return {
    age,ytr,ral,
    futureSal:Math.round(futureSal),
    targetA:Math.round(targetA),targetM:Math.round(targetA/13),
    inpsA:Math.round(inpsA),inpsM:Math.round(inpsM),
    fondoCap:Math.round(fondoCap),tfrCap:Math.round(tfrCap),fondoInc:Math.round(fondoInc),
    totalA:Math.round(totalA),totalM:Math.round(totalA/13),
    gapA:Math.round(gapA),gapM:Math.round(gapA/13),
    replRate:Math.round((totalA/futureSal)*100),
    monthlyNeed:Math.round(monthlyNeed),
    montante:Math.round(montante),
  };
}

/* ─── AVATARS ─────────────────────────────────────────────────── */
const AVATARS=[
  {id:"aria", name:"ARIA",  emoji:"🤖",desc:"Precisa e analitica",   accent:"#F5C800"},
  {id:"sofia",name:"SOFIA", emoji:"👩‍💼",desc:"Empatica e chiara",    accent:"#FF6B35"},
  {id:"max",  name:"MAX",   emoji:"📊",desc:"Data-driven",            accent:"#00BCD4"},
  {id:"luca", name:"LUCA",  emoji:"🎯",desc:"Diretto ed efficace",   accent:"#AB47BC"},
];

/* ─── KB MARCO BUZZONI ────────────────────────────────────────── */
const KB=`Marco Buzzoni è un Consulente Finanziario Certificato iscritto all'Albo OCF con oltre 19 anni di esperienza. Lavora per Azimut, uno dei principali gruppi di gestione del risparmio in Europa (AUM > 80 miliardi €). Specializzazioni: previdenza complementare, fondi pensione, pianificazione patrimoniale, fiscalità. Approccio: ascolto profondo, analisi quantitativa personalizzata, soluzioni concrete e misurabili. La call gratuita dura ~30 minuti, è senza impegno. Email: buzzoni@azimut.it`;

/* ─── CLAUDE API (via Netlify Function) ───────────────────────── */
async function callClaude(messages,system=""){
  const res=await fetch("/.netlify/functions/claude",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system,messages}),
  });
  const data=await res.json();
  return data.content?.[0]?.text||"";
}

/* ─── COMPONENTE PRINCIPALE ───────────────────────────────────── */
function App(){
  const [page,       setPage]       = useState(1);
  const [avatar,     setAvatar]     = useState(null);
  const [photo,      setPhoto]      = useState(null);
  const [userPrompt, setUserPrompt] = useState("");
  const [extracting, setExtracting] = useState(false);
  const [form,       setForm]       = useState({
    birthDate:"",workType:"dipendente",subRegime:"ordinario",
    ralLorda:"",anniContributi:"",
    hasFondoPensione:false,fondoAccumulato:"",fondoVersamentoAnnuo:"",
    includeTFR:false,inpsFileName:"",
  });
  const [results,    setResults]    = useState(null);
  const [chatMsgs,   setChatMsgs]   = useState([]);
  const [chatInput,  setChatInput]  = useState("");
  const [chatLoad,   setChatLoad]   = useState(false);
  const [showCall,   setShowCall]   = useState(false);
  const [callForm,   setCallForm]   = useState({nome:"",cognome:"",cf:"",email:"",fascia:"",privacy:false});
  const [callSent,   setCallSent]   = useState(false);
  const [sendingCall,setSendingCall]= useState(false);

  const photoRef=useRef(null);
  const inpsRef =useRef(null);
  const chatEnd =useRef(null);

  useEffect(()=>{chatEnd.current?.scrollIntoView({behavior:"smooth"});},[chatMsgs]);

  const av=AVATARS.find(a=>a.id===avatar)||AVATARS[0];

  /* estrai dati dal prompt libero */
  async function extractFromPrompt(){
    if(!userPrompt.trim()) return;
    setExtracting(true);
    const txt=await callClaude(
      [{role:"user",content:`Estrai dal testo e rispondi SOLO con JSON valido (no markdown, no testo extra):
{"birthDate":"YYYY-MM-DD or null","workType":"dipendente|pubblico|autonomo|forfettario|imprenditore","subRegime":"ordinario|forfettario","ralLorda":number_or_null,"anniContributi":number_or_null,"hasFondoPensione":boolean_or_null}
Testo: "${userPrompt}"`}],
      "Sei un estrattore JSON. Risposta: SOLO JSON valido, nessun testo extra."
    );
    try{
      const ex=JSON.parse(txt.replace(/```json|```/g,"").trim());
      setForm(f=>({...f,...Object.fromEntries(Object.entries(ex).filter(([,v])=>v!==null&&v!==undefined&&v!==""))}));
    }catch(e){console.warn("parse err:",e);}
    setExtracting(false);
    setPage(3);
  }

  /* calcola e vai ai risultati */
  function goToResults(){
    const r=calcGap(form);
    setResults(r);
    const wl={dipendente:"lavoratore dipendente privato",pubblico:"dipendente pubblico",autonomo:"lavoratore autonomo",forfettario:"regime forfettario",imprenditore:"imprenditore"};
    const intro=`Ciao! Sono ${av.name} 👋\n\nHo analizzato la tua situazione come ${wl[form.workType]||form.workType} con ${form.anniContributi} anni di contributi.\n\n🔴 IL TUO GAP PENSIONISTICO È ${fc(r.gapM)}/MESE\n\nA 67 anni (tra ${r.ytr} anni) l'INPS ti darà circa ${fc(r.inpsM)}/mese, ma per mantenere il tuo tenore di vita ti servirebbero ${fc(r.targetM)}/mese.\n\nIl tasso di sostituzione stimato è solo ${r.replRate}% — ${r.replRate<60?"molto al di sotto":"al di sotto"} dello standard europeo del 70–75%.\n\n💡 COSA FARE:\nVersando circa ${fc(r.monthlyNeed)}/mese in un fondo pensione puoi colmare il gap con vantaggi fiscali immediati:\n\n• Deducibilità fino a €5.164,57/anno → risparmio IRPEF reale\n• Rendimenti tassati al 20% invece del 26%\n• TFR che cresce al 4% invece dell'1,5% in azienda\n• Flessibilità: riscatto anticipato, prestito, RITA\n\nHai domande? Chiedimi! 😊`;
    setChatMsgs([{role:"assistant",content:intro}]);
    setPage(4);
  }

  /* chat con avatar */
  async function sendChat(){
    if(!chatInput.trim()||chatLoad) return;
    const userMsg={role:"user",content:chatInput};
    const msgs=[...chatMsgs,userMsg];
    setChatMsgs(msgs);
    setChatInput("");
    setChatLoad(true);
    const ctx=results
      ?`Profilo: ${form.workType}, RAL ${fc(results.ral)}, età ${results.age}, ${form.anniContributi} anni contributi. Gap: ${fc(results.gapM)}/mese. Versamento suggerito: ${fc(results.monthlyNeed)}/mese.\n${KB}`
      :KB;
    const reply=await callClaude(
      msgs.map(m=>({role:m.role,content:m.content})),
      `Sei ${av.name}, assistente previdenziale professionale di Marco Buzzoni – Azimut. ${ctx} Rispondi in italiano, max 180 parole, emoji moderate, tono professionale ma caldo. Alla fine di ogni risposta invita l'utente a prenotare la call gratuita con Marco Buzzoni per un'analisi approfondita.`
    );
    setChatMsgs([...msgs,{role:"assistant",content:reply}]);
    setChatLoad(false);
  }

  /* invia richiesta call (EmailJS) */
  async function submitCall(){
    if(!callForm.privacy||!callForm.nome||!callForm.email) return;
    setSendingCall(true);
    const body=`NUOVA RICHIESTA DI CALL — Simulatore Gap Pensionistico\n${"═".repeat(52)}\nNome: ${callForm.nome} ${callForm.cognome}\nCF: ${callForm.cf}\nEmail: ${callForm.email}\nFascia oraria: ${callForm.fascia}\n\nDAATI ANALISI\n${"─".repeat(30)}\nData nascita: ${form.birthDate} | Lavoro: ${form.workType} | RAL: ${fc(form.ralLorda||0)}\nAnni contributi: ${form.anniContributi} | Fondo pensione: ${form.hasFondoPensione?"Sì":"No"}\n${results?`Pensione INPS: ${fc(results.inpsM)}/mese | Gap: ${fc(results.gapM)}/mese | Versamento suggerito: ${fc(results.monthlyNeed)}/mese`:""}\n\nCONVERSAZIONE AVATAR\n${"─".repeat(30)}\n${chatMsgs.map(m=>`[${m.role==="user"?"UTENTE":"AVATAR"}]: ${m.content}`).join("\n\n")}`;

    // ── EmailJS ── 
    // Sostituisci i 3 ID qui sotto con i tuoi (vedi guida)
    try{
      await emailjs.send(
        "SERVICE_ID",           // ← il tuo EmailJS Service ID
        "TEMPLATE_ID",          // ← il tuo EmailJS Template ID
        {to_email:"buzzoni@azimut.it", from_name:`${callForm.nome} ${callForm.cognome}`, reply_to:callForm.email, message:body},
        "PUBLIC_KEY"            // ← il tuo EmailJS Public Key
      );
    }catch(e){
      console.warn("EmailJS non configurato — dati loggati in console:",body);
    }
    setSendingCall(false);
    setCallSent(true);
  }

  /* ── helpers UI ───────────────────────────────────────────── */
  const inp=(field,label,type="text",ph="")=>(
    <div style={{marginBottom:18}}>
      <label style={{display:"block",fontFamily:"'DM Mono',monospace",fontSize:10,color:MT,letterSpacing:".22em",marginBottom:7}}>{label}</label>
      <input type={type} className="hborder" value={form[field]||""} placeholder={ph}
        onChange={e=>setForm(f=>({...f,[field]:e.target.value}))}
        style={{width:"100%",background:DL,border:"1px solid #2A2A2A",borderRadius:6,padding:"12px 14px",color:WH,fontSize:13}}/>
    </div>
  );
  const sec=(n,t)=>(
    <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:14,color:Y,letterSpacing:".2em",borderBottom:`1px solid ${DL}`,paddingBottom:10,marginBottom:20,marginTop:30}}>{n} / {t}</div>
  );
  const toggle=(field,opts)=>(
    <div style={{display:"grid",gridTemplateColumns:`repeat(${opts.length},1fr)`,gap:8,marginBottom:18}}>
      {opts.map(([v,l])=>{
        const active=String(form[field])===String(v);
        return(
          <div key={String(v)} onClick={()=>setForm(f=>({...f,[field]:v}))}
            style={{background:active?Y+"18":DL,border:`2px solid ${active?Y:"#2A2A2A"}`,borderRadius:7,padding:"10px 6px",cursor:"pointer",textAlign:"center",fontFamily:"'DM Mono',monospace",fontSize:11,color:active?Y:WH,transition:"all .2s",letterSpacing:".04em"}}>
            {l}
          </div>
        );
      })}
    </div>
  );
  const chk=(field,label)=>(
    <div onClick={()=>setForm(f=>({...f,[field]:!f[field]}))}
      style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer",marginBottom:14}}>
      <div style={{width:20,height:20,border:`2px solid ${form[field]?Y:"#404040"}`,borderRadius:4,background:form[field]?Y:"none",display:"flex",alignItems:"center",justifyContent:"center",color:B,fontSize:12,flexShrink:0,marginTop:1,transition:"all .2s"}}>
        {form[field]&&"✓"}
      </div>
      <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:WH,lineHeight:1.65}}>{label}</span>
    </div>
  );

  /* ══════════════════════════════════════════════════════════════
     PAGINA 1 — LANDING
  ══════════════════════════════════════════════════════════════ */
  if(page===1) return (
    <div className="fade-up" style={{fontFamily:"'Bebas Neue',sans-serif",background:B,color:WH,minHeight:"100vh",display:"flex",flexDirection:"column",position:"relative",zIndex:1}}>
      <div className="scan"/>
      {/* TOP */}
      <div style={{textAlign:"center",padding:"26px 20px 18px",borderBottom:`1px solid ${DL}`,position:"relative",zIndex:2}}>
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:"clamp(9px,2.4vw,13px)",letterSpacing:".28em",color:Y,lineHeight:1.7}}>
          🤖 INTELLIGENZA ARTIFICIALE + 👨‍💼 CONSULENTE FINANZIARIO CERTIFICATO
        </div>
      </div>

      {/* FOTO CONSULENTE */}
      <div style={{display:"flex",justifyContent:"center",padding:"22px 20px 0",position:"relative",zIndex:2}}>
        <div onClick={()=>photoRef.current?.click()}
          style={{width:90,height:90,borderRadius:"50%",border:`2px dashed ${Y}50`,cursor:"pointer",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",background:DL,transition:"border-color .2s"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=Y}
          onMouseLeave={e=>e.currentTarget.style.borderColor=Y+"50"}>
          {photo
            ?<img src={photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt="consulente"/>
            :<div style={{textAlign:"center"}}>
              <div style={{fontSize:22}}>📷</div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:7,color:MT,letterSpacing:".12em",marginTop:4,lineHeight:1.4}}>AGGIUNGI<br/>FOTO</div>
            </div>
          }
        </div>
        <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>setPhoto(ev.target.result);r.readAsDataURL(f);}}}/>
      </div>

      {/* HERO */}
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"22px 20px",textAlign:"center",position:"relative",zIndex:2}}>
        <div style={{fontSize:"clamp(40px,10vw,84px)",lineHeight:.87,color:WH}}>IL TUO PIANO</div>

        <div style={{fontSize:"clamp(40px,10vw,84px)",lineHeight:.87,color:WH,marginBottom:28}}>IL GAP PREVIDENZIALE</div>
        <div style={{width:44,height:3,background:Y,marginBottom:28,borderRadius:2}}/>

        {/* AVATAR */}
        <div style={{width:"100%",maxWidth:500,marginBottom:28}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:MT,letterSpacing:".32em",marginBottom:14}}>SCEGLI IL TUO ASSISTENTE VIRTUALE</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
            {AVATARS.map(a=>(
              <div key={a.id} className="av-card" onClick={()=>setAvatar(a.id)}
                style={{background:avatar===a.id?a.accent+"18":DL,border:`2px solid ${avatar===a.id?a.accent:"#252525"}`,borderRadius:10,padding:"14px 6px",textAlign:"center"}}>
                <div style={{fontSize:26,marginBottom:6}}>{a.emoji}</div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:16,color:avatar===a.id?a.accent:WH,letterSpacing:2}}>{a.name}</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:8,color:MT,marginTop:4,lineHeight:1.45}}>{a.desc}</div>
              </div>
            ))}

        </div>

        <button className="btn-y glow-y" onClick={()=>{if(!avatar)setAvatar("aria");setPage(2);}}
          style={{background:Y,color:B,border:"none",padding:"18px 54px",fontFamily:"'Bebas Neue',sans-serif",fontSize:23,letterSpacing:".14em",borderRadius:4,cursor:"pointer"}}>
          INIZIA L'ANALISI →

      {/* STATS */}

  /* ══════════════════════════════════════════════════════════════
     PAGINA 2 — PROMPT LIBERO
  ══════════════════════════════════════════════════════════════ */
  if(page===2) return (
    <div className="fade-up" style={{fontFamily:"'DM Mono',monospace",background:B,color:WH,minHeight:"100vh",padding:"24px 20px",maxWidth:580,margin:"0 auto"}}>
      <button onClick={()=>setPage(1)} style={{background:"none",border:`1px solid ${DL}`,color:MT,padding:"8px 16px",cursor:"pointer",fontSize:10,letterSpacing:".2em",borderRadius:4,marginBottom:30}}>← INDIETRO</button>

      <div style={{display:"flex",gap:14,alignItems:"flex-start",marginBottom:30}}>
        <div className="float" style={{width:60,height:60,borderRadius:"50%",background:av.accent+"18",border:`2px solid ${av.accent}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0}}>
          {av.emoji}
        </div>
        <div style={{background:DL,border:"1px solid #252525",borderRadius:"4px 16px 16px 16px",padding:"15px 18px",lineHeight:1.78,fontSize:12}}>
          <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:12,color:av.accent,letterSpacing:".18em",display:"block",marginBottom:7}}>{av.name} — ASSISTENTE PREVIDENZIALE</span>
          Ciao! 👋 Per analizzare il tuo <span style={{color:Y}}>gap pensionistico</span>, raccontami la tua situazione.<br/><br/>
          Scrivi liberamente: <strong style={{color:WH}}>quanto guadagni, dove lavori, da quanti anni, se hai già un fondo pensione</strong>... ci penso io a estrarre i dati! 🤖
        </div>
      </div>

      <label style={{display:"block",fontSize:10,color:MT,letterSpacing:".25em",marginBottom:8}}>LA TUA SITUAZIONE</label>
      <textarea value={userPrompt} onChange={e=>setUserPrompt(e.target.value)} className="hborder"
        placeholder="Es: Ho 42 anni, lavoro come dipendente in un'azienda privata da 15 anni, guadagno circa 38.000€ lordi. Non ho ancora un fondo pensione ma sto valutando..."
        style={{width:"100%",minHeight:150,background:DL,border:"1px solid #2A2A2A",borderRadius:8,padding:16,color:WH,fontSize:12,lineHeight:1.78,resize:"vertical"}}/>

      <button className="btn-y" onClick={extractFromPrompt} disabled={extracting||!userPrompt.trim()}
        style={{marginTop:14,background:extracting||!userPrompt.trim()?"#1A1A1A":Y,color:B,border:"none",padding:"15px",width:"100%",fontFamily:"'Bebas Neue',sans-serif",fontSize:19,letterSpacing:".14em",borderRadius:4,cursor:"pointer",transition:"background .2s"}}>
        {extracting
          ?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            <span style={{width:14,height:14,border:"2px solid #333",borderTopColor:B,borderRadius:"50%",display:"inline-block",animation:"spin .8s linear infinite"}}/>
            ANALISI IN CORSO...
          </span>
          :"ANALIZZA E COMPILA IL FORM →"
        }
      </button>
      <button onClick={()=>setPage(3)} style={{marginTop:10,background:"none",border:`1px solid ${DL}`,color:MT,padding:"12px",width:"100%",fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:".2em",borderRadius:4,cursor:"pointer"}}>
        INSERISCI DATI MANUALMENTE
      </button>
    </div>
  );

  /* ══════════════════════════════════════════════════════════════
     PAGINA 3 — FORM DATI
  ══════════════════════════════════════════════════════════════ */
  if(page===3){
    const tfrY=form.ralLorda?Math.round(parseFloat(form.ralLorda)*TFR_PCT):null;
    const canCalc=form.birthDate&&form.ralLorda&&form.anniContributi;
    return(
      <div className="fade-up" style={{fontFamily:"'DM Mono',monospace",background:B,color:WH,minHeight:"100vh",padding:"24px 20px",maxWidth:620,margin:"0 auto"}}>
        <button onClick={()=>setPage(2)} style={{background:"none",border:`1px solid ${DL}`,color:MT,padding:"8px 16px",cursor:"pointer",fontSize:10,letterSpacing:".2em",borderRadius:4,marginBottom:26}}>← INDIETRO</button>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:34,color:Y,letterSpacing:".1em",marginBottom:3}}>ANALISI PREVIDENZIALE</div>
        <div style={{fontSize:9,color:MT,letterSpacing:".3em",marginBottom:4}}>COMPILA I CAMPI PER IL CALCOLO DEL GAP</div>

        {sec("01","DATI ANAGRAFICI")}
        {inp("birthDate","DATA DI NASCITA","date")}

        {sec("02","TIPO DI LAVORO")}
        <label style={{display:"block",fontSize:10,color:MT,letterSpacing:".2em",marginBottom:8}}>CATEGORIA LAVORATIVA</label>
        {toggle("workType",[["dipendente","Dip. Privato"],["pubblico","Dip. Pubblico"],["autonomo","Autonomo P.IVA"],["forfettario","Forfettario"],["imprenditore","Imprenditore"]])}
        {(form.workType==="autonomo"||form.workType==="forfettario")&&(
          <>
            <label style={{display:"block",fontSize:10,color:MT,letterSpacing:".2em",marginBottom:8}}>REGIME FISCALE</label>
            {toggle("subRegime",[["ordinario","Regime Ordinario"],["forfettario","Regime Forfettario"]])}
          </>
        )}

        {sec("03","REDDITO E CONTRIBUTI")}
        {inp("ralLorda","RAL / REDDITO ANNUO LORDO (€)","number","Es: 38000")}
        {inp("anniContributi","ANNI DI CONTRIBUTI GIÀ VERSATI","number","Es: 15")}

        {form.workType==="dipendente"&&(
          <div style={{background:Y+"08",border:`1px solid ${Y}20`,borderRadius:8,padding:16,marginBottom:8}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:13,color:Y,letterSpacing:".2em",marginBottom:8}}>TFR — TRATTAMENTO FINE RAPPORTO</div>
            {tfrY&&<div style={{fontSize:12,color:WH,marginBottom:11}}>TFR annuo stimato: <span style={{color:Y}}>{fc(tfrY)}</span> <span style={{color:MT}}>(6,91% × RAL — automatico)</span></div>}
            {chk("includeTFR","Conferisce il TFR al fondo pensione — rendimento +3,5%/anno vs +1,5% in azienda")}
          </div>
        )}

        {sec("04","PREVIDENZA COMPLEMENTARE")}
        <label style={{display:"block",fontSize:10,color:MT,letterSpacing:".2em",marginBottom:8}}>HAI GIÀ UN FONDO PENSIONE?</label>
        {toggle("hasFondoPensione",[[true,"Sì, ce l'ho"],[false,"Non ancora"]])}
        {(form.hasFondoPensione===true||form.hasFondoPensione==="true")&&(
          <div style={{background:DL,border:"1px solid #2A2A2A",borderRadius:8,padding:16,marginBottom:4}}>
            {inp("fondoAccumulato","CAPITALE ATTUALMENTE ACCUMULATO (€)","number","Es: 15000")}
            {inp("fondoVersamentoAnnuo","VERSAMENTO ANNUO ATTUALE (€)","number","Es: 2400")}
          </div>
        )}

        {sec("05","ESTRATTO CONTO INPS — OPZIONALE")}
        <div onClick={()=>inpsRef.current?.click()}
          style={{border:"1px dashed #282828",borderRadius:8,padding:"18px 16px",textAlign:"center",cursor:"pointer",marginBottom:34,transition:"border-color .2s"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=Y}
          onMouseLeave={e=>e.currentTarget.style.borderColor="#282828"}>
          <div style={{fontSize:24,marginBottom:7}}>📄</div>
          <div style={{fontSize:11,color:form.inpsFileName?Y:MT,letterSpacing:".04em"}}>{form.inpsFileName||"Carica \"La mia pensione futura\" da INPS.it"}</div>
          <div style={{fontSize:9,color:"#404040",marginTop:4}}>PDF · Migliora la precisione dell'analisi</div>
        </div>
        <input ref={inpsRef} type="file" accept=".pdf" style={{display:"none"}}
          onChange={e=>{const f=e.target.files[0];if(f)setForm(fm=>({...fm,inpsFileName:f.name}));}}/>

        <button className="btn-y" onClick={goToResults} disabled={!canCalc}
          style={{background:canCalc?Y:"#1A1A1A",color:B,border:"none",padding:"15px",width:"100%",fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:".12em",borderRadius:4,cursor:"pointer",marginBottom:48,transition:"background .2s"}}>
          CALCOLA IL MIO GAP PENSIONISTICO →
        </button>
      </div>
    );
  }

  /* ══════════════════════════════════════════════════════════════
     PAGINA 4 — RISULTATI
  ══════════════════════════════════════════════════════════════ */
  const r=results;
  const gc=r.gapM>0?"#FF4040":"#4CAF50";
  return(
    <div style={{fontFamily:"'DM Mono',monospace",background:B,color:WH,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div className="fade-up" style={{padding:"24px 20px",maxWidth:640,margin:"0 auto",width:"100%",flex:1,paddingBottom:140}}>
        <button onClick={()=>setPage(3)} style={{background:"none",border:`1px solid ${DL}`,color:MT,padding:"8px 16px",cursor:"pointer",fontSize:10,letterSpacing:".2em",borderRadius:4,marginBottom:22}}>← MODIFICA DATI</button>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:34,color:Y,letterSpacing:".1em",marginBottom:3}}>RISULTATI</div>
        <div style={{fontSize:9,color:MT,letterSpacing:".32em",marginBottom:22}}>ANALISI GAP PENSIONISTICO — {new Date().toLocaleDateString("it-IT")}</div>

        {/* GAP BIG */}
        <div className="glow-y" style={{background:`linear-gradient(135deg,#180000,${B})`,border:`2px solid ${gc}`,borderRadius:12,padding:"22px 20px",marginBottom:13,textAlign:"center"}}>
          <div style={{fontSize:9,color:MT,letterSpacing:".35em",marginBottom:8}}>GAP PENSIONISTICO MENSILE</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"clamp(46px,12vw,80px)",color:gc,lineHeight:1}}>
            {r.gapM>0?"-":"+"}  {fc(Math.abs(r.gapM))}
          </div>
          <div style={{fontSize:10,color:MT,marginTop:8}}>
            {fc(Math.abs(r.gapA))} all'anno · pensionamento a 67 anni (tra <strong style={{color:WH}}>{r.ytr} anni</strong>)
          </div>
        </div>

        {/* KPI */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:13}}>
          {[
            {l:"Pensione INPS Stimata",  v:fc(r.inpsM)+"/mese",     n:"lordo imposte",           c:WH},
            {l:"Pensione Obiettivo",     v:fc(r.targetM)+"/mese",   n:"70% ultimo stipendio",    c:Y},
            {l:"Tasso di Sostituzione",  v:r.replRate+"%",          n:"INPS / futuro stipendio", c:r.replRate<60?"#FF4040":r.replRate<70?"#FF9900":"#4CAF50"},
            {l:"Versamento Suggerito",   v:fc(r.monthlyNeed)+"/mese",n:"per colmare il gap",      c:Y},
          ].map((x,i)=>(
            <div key={i} style={{background:DL,border:"1px solid #252525",borderRadius:8,padding:14}}>
              <div style={{fontSize:8,color:MT,letterSpacing:".18em",marginBottom:6}}>{x.l.toUpperCase()}</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,color:x.c,letterSpacing:".04em"}}>{x.v}</div>
              <div style={{fontSize:8,color:"#484848",marginTop:4}}>{x.n}</div>
            </div>
          ))}
        </div>

        {/* DETTAGLIO */}
        <div style={{background:DL,border:"1px solid #252525",borderRadius:10,padding:18,marginBottom:13}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:13,color:Y,letterSpacing:".2em",marginBottom:14}}>DETTAGLIO CALCOLO</div>
          {[
            {l:"Stipendio attuale",               v:fc(r.ral),              n:""},
            {l:"Stipendio stimato a 67 anni",      v:fc(r.futureSal),        n:`+${Math.round((r.futureSal/r.ral-1)*100)}% in ${r.ytr} anni (+2%/anno media Italia 2014–2024)`},
            {l:"Montante contributivo INPS",       v:fc(r.montante),         n:"capitale accumulato con i contributi versati"},
            {l:"Pensione INPS annua",              v:fc(r.inpsA),            n:"coeff. 5,604% (tabella INPS 2024 – età 67)"},
            r.fondoCap>0?{l:"Capitale fondo + TFR",v:fc(r.fondoCap+r.tfrCap),n:"rendimento medio 4%/anno (linea bilanciata, Covip 2023)"}:null,
            r.fondoInc>0?{l:"Rendita da fondo pensione",v:fc(r.fondoInc)+"/anno",n:"tasso di prelievo 4% del capitale accumulato"}:null,
            {l:"Pensione totale stimata",           v:fc(r.totalM)+"/mese",   n:"INPS + fondo pensione"},
          ].filter(Boolean).map((x,i,arr)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"10px 0",borderBottom:i<arr.length-1?`1px solid #1E1E1E`:"none"}}>
              <div>
                <div style={{fontSize:12,color:WH}}>{x.l}</div>
                {x.n&&<div style={{fontSize:9,color:MT,marginTop:2}}>{x.n}</div>}
              </div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:19,color:Y,whiteSpace:"nowrap",marginLeft:12}}>{x.v}</div>
            </div>
          ))}
        </div>

        {/* METODOLOGIA */}
        <div style={{background:"#0E0E00",border:`1px solid ${Y}1E`,borderRadius:8,padding:15,marginBottom:26}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:12,color:Y,letterSpacing:".2em",marginBottom:10}}>📊 ORIGINE DELLE STIME</div>
          <div style={{fontSize:10,color:MT,lineHeight:1.95}}>
            • <span style={{color:WH}}>Crescita salariale +2%/anno</span>: media retribuzioni Italia 2014–2024 (ISTAT/Banca d'Italia)<br/>
            • <span style={{color:WH}}>Rivalutazione montante INPS +1,5%/anno</span>: media inflazione reale ultimi 10 anni<br/>
            • <span style={{color:WH}}>Coefficiente trasformazione 5,604%</span>: tabella ministeriale INPS 2024 – pensionamento a 67 anni<br/>
            • <span style={{color:WH}}>Rendimento fondo pensione 4%/anno</span>: media storica linea bilanciata (Covip – relazione 2023)<br/>
            • <span style={{color:WH}}>Obiettivo previdenziale 70%</span>: standard europeo per mantenere il tenore di vita<br/>
            • <span style={{color:WH}}>TFR rivalutazione +3,5%/anno nel fondo</span>: vs +1,5% se lasciato in azienda (art. 2120 cc)<br/>
            • <em style={{color:"#3A3A3A"}}>Il calcolo è orientativo. L'analisi precisa richiede la consulenza di un professionista abilitato.</em>
          </div>
        </div>

        {/* CHAT AVATAR */}
        <div style={{marginBottom:36}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:Y,letterSpacing:".1em",marginBottom:13}}>
            {av.emoji} COMMENTO DI {av.name}
          </div>
          <div style={{background:DL,border:"1px solid #252525",borderRadius:12,overflow:"hidden"}}>
            <div style={{maxHeight:420,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:12}}>
              {chatMsgs.map((m,i)=>(
                <div key={i} style={{display:"flex",flexDirection:m.role==="user"?"row-reverse":"row",gap:9,alignItems:"flex-start"}}>
                  {m.role==="assistant"&&(
                    <div style={{width:34,height:34,borderRadius:"50%",background:av.accent+"18",border:`1px solid ${av.accent}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{av.emoji}</div>
                  )}
                  <div style={{background:m.role==="user"?Y+"12":"#0D0D0D",border:`1px solid ${m.role==="user"?Y+"28":"#1E1E1E"}`,borderRadius:m.role==="user"?"14px 3px 14px 14px":"3px 14px 14px 14px",padding:"11px 13px",maxWidth:"82%",fontSize:12,lineHeight:1.75,whiteSpace:"pre-wrap",color:WH}}>
                    {m.content}
                  </div>
                </div>
              ))}
              {chatLoad&&(
                <div style={{display:"flex",gap:9,alignItems:"flex-start"}}>
                  <div style={{width:34,height:34,borderRadius:"50%",background:av.accent+"18",border:`1px solid ${av.accent}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{av.emoji}</div>
                  <div style={{background:"#0D0D0D",border:"1px solid #1E1E1E",borderRadius:"3px 14px 14px 14px",padding:"11px 13px",fontSize:12,color:MT,animation:"pulse 1.4s infinite"}}>⚙️ {av.name} sta elaborando...</div>
                </div>
              )}
              <div ref={chatEnd}/>
            </div>
            <div style={{borderTop:`1px solid #1E1E1E`,padding:11,display:"flex",gap:8}}>
              <input value={chatInput} onChange={e=>setChatInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendChat()} className="hborder"
                placeholder={`Chiedi a ${av.name}... es: come funziona la deducibilità?`}
                style={{flex:1,background:"#0A0A0A",border:"1px solid #242424",borderRadius:6,padding:"9px 12px",color:WH,fontSize:12}}/>
              <button className="btn-y" onClick={sendChat} disabled={chatLoad||!chatInput.trim()}
                style={{background:chatLoad||!chatInput.trim()?"#1A1A1A":Y,color:B,border:"none",borderRadius:6,padding:"9px 17px",cursor:"pointer",fontFamily:"'Bebas Neue',sans-serif",fontSize:14,letterSpacing:".1em",transition:"background .2s"}}>
                INVIA
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* STICKY CTA */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:B,borderTop:`2px solid ${Y}25`,padding:"13px 20px",zIndex:50}}>
        <div style={{maxWidth:640,margin:"0 auto"}}>
          <button className="btn-y glow-y" onClick={()=>setShowCall(true)}
            style={{background:Y,color:B,border:"none",padding:"14px",width:"100%",fontFamily:"'Bebas Neue',sans-serif",fontSize:18,letterSpacing:".1em",borderRadius:4,cursor:"pointer"}}>
            📞 RICHIEDI UNA CALL GRATUITA CON MARCO BUZZONI
          </button>
        </div>
      </div>

      {/* MODAL CALL */}
      {showCall&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.95)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20}}>
          {!callSent?(
            <div style={{background:"#121212",border:`2px solid ${Y}`,borderRadius:16,padding:26,maxWidth:450,width:"100%",maxHeight:"92vh",overflowY:"auto"}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,color:Y,letterSpacing:".1em",marginBottom:3}}>PRENOTA LA CALL</div>
              <div style={{fontSize:9,color:MT,letterSpacing:".24em",marginBottom:22}}>CONSULENZA GRATUITA · MARCO BUZZONI · AZIMUT</div>

              {[["nome","NOME","text"],["cognome","COGNOME","text"],["cf","CODICE FISCALE","text"],["email","EMAIL","email"]].map(([f,l,t])=>(
                <div key={f} style={{marginBottom:14}}>
                  <label style={{display:"block",fontSize:9,color:MT,letterSpacing:".22em",marginBottom:6}}>{l}</label>
                  <input type={t} value={callForm[f]} className="hborder"
                    onChange={e=>setCallForm(c=>({...c,[f]:e.target.value}))}
                    style={{width:"100%",background:"#0A0A0A",border:"1px solid #282828",borderRadius:4,padding:"11px 13px",color:WH,fontSize:12}}/>
                </div>
              ))}

              <div style={{marginBottom:20}}>
                <label style={{display:"block",fontSize:9,color:MT,letterSpacing:".22em",marginBottom:6}}>FASCIA ORARIA PREFERITA PER IL RICHIAMO</label>
                <select value={callForm.fascia} onChange={e=>setCallForm(c=>({...c,fascia:e.target.value}))}
                  style={{width:"100%",background:"#0A0A0A",border:"1px solid #282828",borderRadius:4,padding:"11px 13px",color:WH,fontSize:12,outline:"none"}}>
                  <option value="">Seleziona orario...</option>
                  <option value="09-12">Mattina 09:00–12:00</option>
                  <option value="12-15">Primo pomeriggio 12:00–15:00</option>
                  <option value="15-18">Pomeriggio 15:00–18:00</option>
                  <option value="18-20">Sera 18:00–20:00</option>
                </select>
              </div>

              <div onClick={()=>setCallForm(c=>({...c,privacy:!c.privacy}))}
                style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer",marginBottom:20}}>
                <div style={{width:18,height:18,border:`2px solid ${callForm.privacy?Y:"#444"}`,borderRadius:3,background:callForm.privacy?Y:"none",display:"flex",alignItems:"center",justifyContent:"center",color:B,fontSize:11,flexShrink:0,marginTop:2,transition:"all .2s"}}>
                  {callForm.privacy&&"✓"}
                </div>
                <div style={{fontSize:10,color:MT,lineHeight:1.75}}>
                  Acconsento al trattamento dei miei dati personali ai sensi del Reg. UE 679/2016 (GDPR). I dati <strong style={{color:WH}}>non saranno ceduti a terzi</strong> e saranno utilizzati esclusivamente da <span style={{color:WH}}>Marco Buzzoni – Azimut</span> per la consulenza previdenziale richiesta.
                </div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <button onClick={()=>setShowCall(false)} style={{background:"none",border:`1px solid ${DL}`,color:MT,padding:"12px",fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:".1em",borderRadius:4,cursor:"pointer"}}>ANNULLA</button>
                <button className="btn-y" onClick={submitCall} disabled={sendingCall||!callForm.privacy||!callForm.nome||!callForm.email}
                  style={{background:(!sendingCall&&callForm.privacy&&callForm.nome&&callForm.email)?Y:"#1A1A1A",color:B,border:"none",padding:"12px",fontFamily:"'Bebas Neue',sans-serif",fontSize:15,letterSpacing:".1em",borderRadius:4,cursor:"pointer",transition:"background .2s"}}>
                  {sendingCall?"INVIO...":"CONFERMA →"}
                </button>
              </div>
            </div>
          ):(
            <div style={{background:"#121212",border:`2px solid ${Y}`,borderRadius:16,padding:36,maxWidth:380,width:"100%",textAlign:"center"}}>
              <div style={{fontSize:52,marginBottom:14}}>✅</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,color:Y,letterSpacing:".1em",marginBottom:9}}>RICHIESTA INVIATA!</div>
              <div style={{fontSize:12,color:WH,lineHeight:1.85,marginBottom:22}}>
                Marco ti contatterà nella fascia oraria selezionata.<br/>
                Conferma a <span style={{color:Y}}>{callForm.email}</span>.
              </div>
              <button onClick={()=>setShowCall(false)} style={{background:Y,color:B,border:"none",padding:"12px 34px",fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:".1em",borderRadius:4,cursor:"pointer"}}>CHIUDI</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── EmailJS CDN stub — verrà caricato da index.html ── */
const emailjs=window.emailjs||{send:async()=>Promise.resolve()};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
